aid: conversightai
name: ConverSight.ai
description: >-
  ConverSight.ai is an agentic decision-intelligence platform for supply chain,
  giving manufacturing, distribution, and retail organizations AI agents that
  automate routine planning, procurement, and optimization decisions. Its
  patented Athena AI engine sits on a Data Workbench, a UniVerse knowledge
  layer, and a workflow engine, and ships ready-to-deploy agents (Demand
  Planner, Supply Planner, Production Planner, Procurement, Inventory Optimizer,
  Supply Assurance, Supplier Scorecard, S&OP Coordinator) across four
  intelligence levels from conversational assistant to autonomous AI employee.
  Pre-built connectors and open APIs let it run alongside SAP, Acumatica, Sage,
  NetSuite, Microsoft Dynamics, Snowflake, QuickBooks, Kinaxis, Fishbowl, and
  Katana, and the company is a Techstars-backed venture serving 1,500+ supply
  chain organizations under SOC 2 Type II, ISO 27001, and GDPR compliance.
